[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pingyitong"
version = "0.6.41"
description = "屏译通 —— 基于本地大模型的桌面实时原位翻译系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "见 LICENSE" }
authors = [{ name = "邱鼎淳（屏译通团队）" }]
keywords = ["translation", "ocr", "llm", "offline", "desktop", "overlay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

# 运行依赖与 requirements.txt 保持一致
# 三个 prefetch 依赖曾只写在 requirements.txt 里而漏掉此处，导致
# `pip install -e .` 与 `pip install -r requirements.txt` 装出两套环境。
# src/pingyitong/services/prefetch/ 真实 import 这三个模块。
dependencies = [
    "PyQt6>=6.5,<7.0",
    "mss>=9.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "rapidocr-onnxruntime==1.4.4",
    "psutil>=5.9",
    "llama-cpp-python>=0.2.20",
    "rapidfuzz>=3.0",
    "charset-normalizer>=3.0",
    "trafilatura>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1.9", "mypy>=1.8", "types-psutil>=5.9", "pyinstaller>=6.3"]
build = ["pyinstaller>=6.3"]

[project.scripts]
pingyitong = "pingyitong.__main__:main"

[project.gui-scripts]
pingyitong-gui = "pingyitong.ui.app:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 不声明 py.typed：仓库的 mypy 配置（见下方 [tool.mypy]）把 src/pingyitong/ui/
# 整个排除在外，从未承诺全量类型覆盖。放一个 py.typed 会让 Pyright/IDE 把本包
# 当作"有类型承诺"的包来检查，而现有标注密度撑不起这个承诺——实测开启后
# pipeline.py 单文件即报出 20+ 处 object 属性错误。没有 py.typed 时
# 下游项目按无类型包处理，反而是诚实的标注状态。

# ---------------------------------------------------------------------------
# 工具配置
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort 导入排序
    "N",   # pep8 命名
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # 行长度由 formatter 负责，中文注释按字符计宽会误报
    "N802",  # Qt 覆写方法使用驼峰命名（paintEvent 等）
    "N803",  # Qt 回调参数名
    "N815",  # Qt 混用命名风格
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
# Qt 的信号/槽与动态属性难以静态推断，对 UI 层放宽要求
files = ["src/pingyitong"]
exclude = ["src/pingyitong/ui/"]

[[tool.mypy.overrides]]
module = ["cv2", "mss", "rapidocr_onnxruntime", "llama_cpp", "pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
