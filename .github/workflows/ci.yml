name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # P0: 依赖文件同步检验。pyproject.toml、requirements.txt、requirements-dev.txt
  # 三处依赖清单必须保持一致，否则 `pip install -e .` 与 `pip install -r`
  # 装出两套环境，prefetch 子包会缺失 rapidfuzz / trafilatura 等运行时模块。
  # 本 job 只依赖标准库，无需安装第三方包，可在任何环境快速通过。
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 依赖文件同步检查
        run: python scripts/verify_deps_sync.py

  # 纯静态检查：不安装任何第三方依赖，直接跑仓库自带的导入检查。
  # 这个 job 存在的意义是"零依赖也能验证仓库自身一致性"——
  # 评审者克隆后不用装 600MB 依赖就能确认包结构没坏。
  static:
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 导入一致性检查（零第三方依赖，仅标准库）
        run: python scripts/check_imports.py
      - name: 构建脚本可加载
        # tests/test_build_exe_smoke.py 会 exec build/build_exe.py。
        # .gitignore 曾把整个 build/ 排除，导致干净克隆此处失败。
        # build_exe.py 在非 Windows 平台只打印警告不退出，此处只验证可解析。
        run: python -c "import importlib.util, pathlib; s=importlib.util.spec_from_file_location('b', pathlib.Path('build/build_exe.py')); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print('build_exe loaded:', m.APP_NAME_EN)"
      - name: ruff 语法检查
        run: |
          python -m pip install ruff>=0.1.9
          python -m ruff check src tests
      - name: 结构树与仓库同步
        run: python scripts/verify_readme_tree.py

  # 完整 job：装依赖后跑 ruff + pytest。
  # QT_QPA_PLATFORM=offscreen 让需要 PyQt6 的测试在无显示器环境运行。
  full:
    runs-on: windows-latest
    needs: deps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: ruff 检查
        run: python -m ruff check src tests
      - name: 导入一致性检查（含第三方依赖可用性）
        run: python scripts/check_imports.py --check-third-party
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
